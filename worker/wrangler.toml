name = "urbancart-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "afeeea28ef4b58aad33f54322feaab68"
workers_dev = true

# Production API host
[[routes]]
pattern = "api.nogorcar.store"
custom_domain = true

[vars]
CLIENT_URL = "https://nogorcar.store"
ADMIN_URL = "https://admin.nogorcar.store"
DELIVERY_CHARGE = "120"
ADMIN_EMAIL = "admin@urbancart.com"
ALLOW_SEED = "false"

[[d1_databases]]
binding = "DB"
database_name = "urbancart"
database_id = "816ca7b9-9634-49e9-a9f3-1091dbf00e4d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "urbancart-media"

[dev]
port = 8787
